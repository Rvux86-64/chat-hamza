<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supabase Chat - Pro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        :root {
          --bg-main: #0b0f19;
          --panel-bg: #111827;
          --accent: #3b82f6; 
          --border-color: #1f2937;
          --text-main: #f3f4f6;
          --text-muted: #9ca3af;
          --msg-self: var(--accent);
          --msg-other: #1f2937;
          --msg-text-self: #ffffff;
        } 

        body.light-mode {
          --bg-main: #f3f4f6; --panel-bg: #ffffff; --border-color: #e5e7eb;
          --text-main: #111827; --text-muted: #6b7280; --msg-other: #f3f4f6;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { display: flex; justify-content: center; align-items: center; height: 100vh; background-color: var(--bg-main); color: var(--text-main); transition: background 0.3s; }

        .auth-modal { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.8); display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .auth-box { background: var(--panel-bg); padding: 32px; border-radius: 12px; border: 1px solid var(--border-color); width: 100%; max-width: 350px; text-align: center; }
        .auth-box input { width: 100%; background: var(--bg-main); border: 1px solid var(--border-color); color: var(--text-main); padding: 12px; border-radius: 8px; margin: 10px 0; outline: none; }
        .auth-box button { width: 100%; padding: 14px; background: var(--accent); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 10px;}

        .chat-wrapper { display: flex; width: 1000px; height: 750px; background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 12px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .sidebar { width: 280px; background: var(--bg-main); border-right: 1px solid var(--border-color); padding: 20px; display: flex; flex-direction: column; gap: 20px; }
        
        .controls-row { display: flex; gap: 10px; align-items: center; justify-content: space-between; background: var(--panel-bg); padding: 10px; border-radius: 8px; border: 1px solid var(--border-color); }
        .icon-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 1.1rem; }
        .icon-btn:hover { color: var(--accent); }
        input[type="color"] { border: none; width: 30px; height: 30px; border-radius: 50%; cursor: pointer; background: transparent; }
        input[type="color"]::-webkit-color-swatch { border-radius: 50%; border: none; }

        .channels-section { flex: 1; overflow-y: auto; }
        .section-header { display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; margin-bottom: 10px; }
        .channel-item { padding: 10px; border-radius: 6px; cursor: pointer; color: var(--text-muted); margin-bottom: 4px; display: flex; align-items: center; gap: 8px; }
        .channel-item.active { background: var(--accent); color: white; font-weight: bold; opacity: 0.9; }

        .user-card { display: flex; align-items: center; gap: 12px; background: var(--panel-bg); padding: 15px; border-radius: 8px; border: 1px solid var(--border-color); }
        .avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--accent); object-fit: cover; }
        .user-info { flex: 1; overflow: hidden; }
        .user-info span { display: block; font-weight: bold; font-size: 0.95rem; text-overflow: ellipsis; }
        .logout-btn { background: none; border: none; color: #ef4444; cursor: pointer; font-size: 0.8rem; margin-top: 4px; }

        .main-chat { flex: 1; display: flex; flex-direction: column; }
        .chat-header { padding: 20px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
        .header-title { font-weight: bold; font-size: 1.2rem; }
        
        .call-btn { background: #10b981; color: white; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: bold; display: flex; gap: 8px; align-items: center; transition: 0.2s; }
        .call-btn:hover { background: #059669; }

        .chat-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }
        .msg-row { display: flex; gap: 12px; max-width: 80%; align-items: flex-end; }
        .msg-row.self { align-self: flex-end; flex-direction: row-reverse; }
        .message { padding: 12px 16px; border-radius: 12px; background: var(--msg-other); color: var(--text-main); }
        .msg-row.self .message { background: var(--msg-self); color: var(--msg-text-self); }
        .msg-header { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 4px; }
        .msg-user { font-size: 0.75rem; font-weight: bold; color: var(--accent); }
        .msg-row.self .msg-user { color: rgba(255,255,255,0.8); }
        .msg-time { font-size: 0.65rem; opacity: 0.7; }
        
        .chat-input { display: flex; padding: 20px; border-top: 1px solid var(--border-color); gap: 10px; }
        .chat-input input { flex: 1; background: var(--bg-main); border: 1px solid var(--border-color); color: var(--text-main); padding: 14px; border-radius: 8px; outline: none; }
        .chat-input button { background: var(--accent); border: none; color: white; width: 50px; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="authModal" class="auth-modal">
        <div class="auth-box">
            <h2>Join the Chat</h2>
            <form id="loginForm">
                <input type="text" id="usernameInput" placeholder="Choose a username..." required autocomplete="off" maxlength="20">
                <input type="url" id="avatarInput" placeholder="Paste an image URL here (Optional)" autocomplete="off">
                <button type="submit">Enter</button>
            </form>
        </div>
    </div>

    <div class="chat-wrapper" id="mainApp" style="display: none;">
        <div class="sidebar">
            <div class="controls-row">
                <button id="themeToggle" class="icon-btn"><i class="fa-solid fa-moon"></i></button>
                <input type="color" id="colorPicker" value="#3b82f6">
            </div>
            
            <div class="channels-section">
                <div class="section-header">
                    <span>Rooms</span>
                    <button id="createRoomBtn" class="icon-btn"><i class="fa-solid fa-plus"></i></button>
                </div>
                <div id="channelsList"></div>
            </div>

            <div class="user-card">
                <img id="myAvatar" class="avatar" src="" alt="Avatar">
                <div class="user-info">
                    <span id="displayUsername">User</span>
                    <button id="logoutBtn" class="logout-btn">Change Profile</button>
                </div>
            </div>
        </div>

        <div class="main-chat">
            <div class="chat-header">
                <div class="header-title" id="currentRoomName">Select a room</div>
                <button id="videoCallBtn" class="call-btn"><i class="fa-solid fa-video"></i> Video / Voice</button>
            </div>
            <div class="chat-box" id="chatBox"></div>
            
            <form class="chat-input" id="messageForm">
                <input type="text" id="messageInput" placeholder="Type your message..." required autocomplete="off">
                <button type="submit"><i class="fa-solid fa-paper-plane"></i></button>
            </form>
        </div>
    </div>

    <script>
        const SB_URL = "https://jziqxqpvgeiwbthdxbze.supabase.co";
        const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp6aXF4cXB2Z2Vpd2J0aGR4YnplIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3NjMwMTEsImV4cCI6MjEwMzMzOTAxMX0.opW1zH8ivEFbPTkn5r1EaINzvfH8fUflU8TPL9QVaw0";
        const supabase = window.supabase.createClient(SB_URL, SB_KEY);

        let currentUser = null;
        let currentAvatar = null;
        let activeRoomId = null;

        // Visual Customization
        document.getElementById('colorPicker').addEventListener('input', (e) => {
            document.documentElement.style.setProperty('--accent', e.target.value);
            localStorage.setItem('chat_color', e.target.value);
        });

        document.getElementById('themeToggle').addEventListener('click', () => {
            document.body.classList.toggle('light-mode');
            const isLight = document.body.classList.contains('light-mode');
            document.querySelector('#themeToggle i').className = isLight ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
            localStorage.setItem('chat_theme', isLight ? 'light' : 'dark');
        });

        if (localStorage.getItem('chat_color')) {
            document.documentElement.style.setProperty('--accent', localStorage.getItem('chat_color'));
            document.getElementById('colorPicker').value = localStorage.getItem('chat_color');
        }
        if (localStorage.getItem('chat_theme') === 'light') {
            document.body.classList.add('light-mode');
            document.querySelector('#themeToggle i').className = 'fa-solid fa-sun';
        }

        // Login Logic
        function checkLogin() {
            const savedUser = localStorage.getItem('chat_username');
            const savedAvatar = localStorage.getItem('chat_avatar');
            
            if (savedUser) {
                currentUser = savedUser;
                currentAvatar = savedAvatar || `https://ui-avatars.com/api/?name=${currentUser}&background=random`;
                
                document.getElementById('displayUsername').textContent = currentUser;
                document.getElementById('myAvatar').src = currentAvatar;
                
                document.getElementById('authModal').style.display = 'none';
                document.getElementById('mainApp').style.display = 'flex';
                fetchRooms();
            } else {
                document.getElementById('authModal').style.display = 'flex';
                document.getElementById('mainApp').style.display = 'none';
            }
        }

        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const name = document.getElementById('usernameInput').value.trim();
            const customAvatarUrl = document.getElementById('avatarInput').value.trim();
            
            if (name) {
                localStorage.setItem('chat_username', name);
                if (customAvatarUrl) {
                    localStorage.setItem('chat_avatar', customAvatarUrl);
                } else {
                    localStorage.removeItem('chat_avatar'); 
                }
                checkLogin();
            }
        });

        document.getElementById('logoutBtn').addEventListener('click', () => {
            localStorage.removeItem('chat_username');
            localStorage.removeItem('chat_avatar');
            document.getElementById('chatBox').innerHTML = '';
            activeRoomId = null;
            checkLogin();
        });

        // Chat Rooms
        async function fetchRooms() {
            const { data: rooms } = await supabase.from('rooms').select('*').order('name');
            const list = document.getElementById('channelsList');
            list.innerHTML = '';
            
            if (rooms) {
                rooms.forEach((room, index) => {
                    const el = document.createElement('div');
                    el.className = 'channel-item';
                    el.innerHTML = `<i class="fa-solid fa-hashtag"></i> ${room.name}`;
                    el.onclick = () => {
                        document.querySelectorAll('.channel-item').forEach(c => c.classList.remove('active'));
                        el.classList.add('active');
                        switchRoom(room.id, room.name);
                    };
                    list.appendChild(el);
                    if (index === 0 && !activeRoomId) el.click();
                });
            }
        }

        document.getElementById('createRoomBtn').addEventListener('click', async () => {
            const name = prompt("New room name:");
            if (name) {
                await supabase.from('rooms').insert([{ name }]);
                fetchRooms();
            }
        });

        async function switchRoom(id, name) {
            activeRoomId = id;
            document.getElementById('currentRoomName').textContent = `# ${name}`;
            const box = document.getElementById('chatBox');
            box.innerHTML = '';
            
            const { data } = await supabase.from('messages').select('*').eq('room_id', id).order('created_at');
            if (data) data.forEach(msg => appendMessage(msg));
        }

        // Messages & Rendering
        function appendMessage(msg) {
            const isSelf = msg.username === currentUser;
            const timeStr = new Date(msg.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            
            // Fallback to generated avatar if they didn't supply a custom one
            const avatarToUse = msg.avatar_url || `https://ui-avatars.com/api/?name=${msg.username}&background=random`;
            
            const div = document.createElement('div');
            div.className = `msg-row ${isSelf ? 'self' : ''}`;
            div.innerHTML = `
                <img class="avatar" src="${avatarToUse}" style="width: 32px; height: 32px;">
                <div class="message">
                    <div class="msg-header">
                        <span class="msg-user">${msg.username}</span>
                        <span class="msg-time">${timeStr}</span>
                    </div>
                    <div>${msg.content}</div>
                </div>
            `;
            const box = document.getElementById('chatBox');
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        }

        document.getElementById('messageForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const input = document.getElementById('messageInput');
            if (input.value.trim() && activeRoomId) {
                await supabase.from('messages').insert([{
                    username: currentUser, 
                    content: input.value.trim(), 
                    room_id: activeRoomId,
                    avatar_url: currentAvatar // Sends your custom picture URL to the database
                }]);
                input.value = '';
            }
        });

        // Realtime
        supabase.channel('public:messages')
            .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
                if (payload.new.room_id === activeRoomId) appendMessage(payload.new);
            }).subscribe();

        // Video Calling (Jitsi Integration)
        document.getElementById('videoCallBtn').addEventListener('click', () => {
            if (!activeRoomId) return alert("Select a chat room first.");
            const roomString = document.getElementById('currentRoomName').textContent.replace('# ', '').replace(/[^a-zA-Z0-9]/g, '_');
            const uniqueMeetingId = `SupaChat_${roomString}_${activeRoomId}`;
            window.open(`https://meet.jit.si/${uniqueMeetingId}`, '_blank');
        });

        checkLogin();
    </script>
</body>
</html>
