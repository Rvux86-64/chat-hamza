<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supabase Chat App</title>
    <link rel="stylesheet" href="style.css">
    <!-- Include Supabase JS CDN Client -->
    <!-- Alternative CDN link via ESM.sh -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.0/dist/umd/supabase.min.js"></script>

</head>
<body>

    <div class="chat-container">
        <div class="chat-header">
            <h2>Supabase Realtime Chat</h2>
            <input type="text" id="username" placeholder="Enter username..." value="Guest">
        </div>
        
        <div class="chat-box" id="chatBox">
            <!-- Messages will load here dynamically -->
        </div>

        <form class="chat-input-area" id="messageForm">
            <input type="text" id="messageInput" placeholder="Type a message..." required autocomplete="off">
            <button type="submit">Send</button>
        </form>
    </div>

    <script src="app.js"></script>
</body>
</html>
