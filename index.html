<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supabase Chat - Pro</title>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        :root {
            /* Default Dark Theme */
            --bg-main: #0b0f19;
            --panel-bg: #111827;
            --accent: #3b82f6; 
            --accent-hover: #2563eb;
            --border-color: #1f2937;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --msg-self: var(--accent);
            --msg-other: #1f2937;
            --msg-text-self: #ffffff;
        } 

        /* Light Theme Overrides */
        body.light-mode {
            --bg-main: #f3f4f6;
            --panel-bg: #ffffff;
            --border-color: #e5e7eb;
            --text-main: #111827;
            --text-muted: #6b7280;
            --msg-other: #e5e7eb;
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        }

        body { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            background-color: var(--bg-main); 
            color: var(--text-main); 
            overflow: hidden; 
            transition: background-color 0.3s ease;
        }

        /* --- Login Modal --- */
        .auth-modal {
            position: fixed; 
            inset: 0; 
            background: rgba(11, 15, 25, 0.95);
            display: flex; 
            justify-content: center; 
            align-items: center; 
            z-index: 1000;
        }

        .auth-box {
            background: var(--panel-bg); 
            padding: 32px; 
            border-radius: 12px;
            border: 1px solid var(--border-color); 
            width: 100%; 
            max-width: 350px;
            display: flex; 
            flex-direction: column; 
            gap: 16px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5); 
            text-align: center;
        }

        .auth-box h2 { 
            color: var(--accent); 
        }

        .auth-box p { 
            color: var(--text-muted); 
            font-size: 0.9rem; 
            margin-bottom: 10px; 
        }

        .auth-box input {
            width: 100%; 
            background: var(--bg-main); 
            border: 1px solid var(--border-color);
            color: var(--text-main); 
            padding: 12px; 
            border-radius: 8px;
            outline: none; 
            font-size: 1rem; 
        }
        
        .auth-box input:focus { 
            border-color: var(--accent); 
        }

        .auth-box button {
            width: 100%; 
            padding: 14px; 
            background: var(--accent);
            color: white; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer;
            font-weight: bold; 
            font-size: 1rem; 
            transition: background 0.2s;
        }

        .auth-box button:hover { 
            background: var(--accent-hover); 
        }

        /* --- App Layout --- */
        .chat-wrapper { 
            display: flex; 
            width: 950px; 
            height: 700px; 
            background: var(--panel-bg); 
            border: 1px solid var(--border-color); 
            border-radius: 12px; 
            overflow: hidden; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }

        .sidebar { 
            width: 260px; 
            background: var(--bg-main); 
            border-right: 1px solid var(--border-color); 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            gap: 20px; 
            transition: background-color 0.3s ease;
        }

        .brand { 
            font-size: 1.2rem; 
            font-weight: bold; 
            color: var(--accent); 
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* --- Customization Controls --- */
        .controls-row { 
            display: flex; 
            gap: 10px; 
            align-items: center; 
            justify-content: space-between; 
            background: var(--panel-bg); 
            padding: 10px 15px; 
            border-radius: 8px; 
            border: 1px solid var(--border-color); 
        }

        .icon-btn { 
            background: none; 
            border: none; 
            color: var(--text-muted); 
            cursor: pointer; 
            font-size: 1.1rem; 
            transition: color 0.2s;
        }

        .icon-btn:hover { 
            color: var(--accent); 
        }

        input[type="color"] { 
            border: none; 
            width: 28px; 
            height: 28px; 
            border-radius: 50%; 
            cursor: pointer; 
            background: transparent; 
        }

        input[type="color"]::-webkit-color-swatch { 
            border-radius: 50%; 
            border: none; 
        }

        /* --- Channels --- */
        .channels-section { 
            flex: 1; 
            overflow-y: auto; 
        }

        .section-header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 10px; 
            color: var(--text-muted); 
            font-size: 0.8rem; 
            text-transform: uppercase; 
            font-weight: bold;
        }
        
        .channel-item { 
            padding: 10px; 
            border-radius: 6px; 
            cursor: pointer; 
            color: var(--text-muted); 
            margin-bottom: 4px; 
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .channel-item:hover { 
            background: rgba(128,128,128,0.1); 
        }

        .channel-item.active { 
            background: rgba(59, 130, 246, 0.15); 
            color: var(--accent); 
            font-weight: bold; 
        }

        /* --- User Profile Card --- */
        .user-card { 
            display: flex; 
            align-items: center; 
            gap: 12px; 
            background: var(--panel-bg); 
            padding: 15px; 
            border-radius: 8px; 
            border: 1px solid var(--border-color); 
        }

        .avatar { 
            width: 40px; 
            height: 40px; 
            border-radius: 50%; 
            background: var(--accent); 
            object-fit: cover; 
        }

        .user-info { 
            flex: 1; 
            overflow: hidden; 
        }

        .user-info span { 
            display: block; 
            font-weight: bold; 
            font-size: 0.95rem; 
            text-overflow: ellipsis; 
            white-space: nowrap;
            overflow: hidden;
        }

        .logout-btn { 
            background: transparent; 
            border: none; 
            color: #ef4444; 
            cursor: pointer; 
            font-size: 0.8rem; 
            margin-top: 4px; 
            padding: 0;
            text-align: left;
        }

        .logout-btn:hover {
            text-decoration: underline;
        }

        /* --- Main Chat Area --- */
        .main-chat { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
        }

        .chat-header { 
            padding: 20px; 
            border-bottom: 1px solid var(--border-color); 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
        }

        .header-title { 
            font-weight: bold; 
            font-size: 1.2rem; 
        }
        
        .call-btn { 
            background: #10b981; 
            color: white; 
            border: none; 
            padding: 8px 16px; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: bold; 
            display: flex; 
            gap: 8px; 
            align-items: center; 
            transition: background 0.2s; 
        }

        .call-btn:hover { 
            background: #059669; 
        }

        /* --- Messages --- */
        .chat-box { 
            flex: 1; 
            padding: 20px; 
            overflow-y: auto; 
            display: flex; 
            flex-direction: column; 
            gap: 16px; 
        }
        
        .msg-row { 
            display: flex; 
            gap: 12px; 
            max-width: 80%; 
            align-items: flex-end; 
        }

        .msg-row.self { 
            align-self: flex-end; 
            flex-direction: row-reverse; 
        }
        
        .message { 
            padding: 12px 16px; 
            border-radius: 12px; 
            background: var(--msg-other); 
            color: var(--text-main); 
        }

        .msg-row.self .message { 
            background: var(--msg-self); 
            color: var(--msg-text-self); 
        }
        
        .msg-header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            gap: 12px; 
            margin-bottom: 4px; 
        }

        .msg-user { 
            font-size: 0.75rem; 
            font-weight: bold; 
            color: var(--accent); 
        }

        .msg-row.self .msg-user { 
            color: rgba(255,255,255,0.8); 
        }

        .msg-time { 
            font-size: 0.65rem; 
            opacity: 0.7; 
        }

        /* --- Input Area --- */
        .chat-input { 
            display: flex; 
            padding: 20px; 
            border-top: 1px solid var(--border-color); 
            gap: 10px; 
            background: var(--bg-main);
        }

        .chat-input input { 
            flex: 1; 
            background: var(--panel-bg); 
            border: 1px solid var(--border-color); 
            color: var(--text-main); 
            padding: 14px; 
            border-radius: 8px; 
            outline: none; 
            font-size: 0.95rem;
        }

        .chat-input input:focus {
            border-color: var(--accent);
        }

        .chat-input button { 
            background: var(--accent); 
            border: none; 
            color: white; 
            width: 50px; 
            border-radius: 8px; 
            cursor: pointer; 
            font-size: 1.1rem;
            transition: background 0.2s;
        }

        .chat-input button:hover {
            background: var(--accent-hover);
        }
    </style>
</head>
<body>

    <!-- Simple Login Modal -->
    <div id="authModal" class="auth-modal">
        <div class="auth-box">
            <h2>Join FastChat</h2>
            <p>Customize your profile to continue</p>
            <form id="loginForm">
                <input type="text" id="usernameInput" placeholder="Username" required autocomplete="off" maxlength="20">
                <input type="url" id="avatarInput" placeholder="Image URL for Profile Pic (Optional)" autocomplete="off">
                <button type="submit">Enter Chat</button>
            </form>
        </div>
    </div>

    <!-- Main Chat App -->
    <div class="chat-wrapper" id="mainApp" style="display: none;">
        <div class="sidebar">
            <div class="brand"><i class="fa-solid fa-bolt"></i> FastChat</div>
            
            <!-- Customization Controls -->
            <div class="controls-row">
                <button id="themeToggle" class="icon-btn" title="Toggle Light/Dark Mode"><i class="fa-solid fa-moon"></i></button>
                <div title="Pick Accent Color">
                    <input type="color" id="colorPicker" value="#3b82f6">
                </div>
            </div>

            <div class="channels-section">
                <div class="section-header">
                    <span>Rooms</span>
                    <button id="createRoomBtn" class="icon-btn" title="Create a new room"><i class="fa-solid fa-plus"></i></button>
                </div>
                <div id="channelsList"></div>
            </div>

            <div class="user-card">
                <img id="myAvatar" class="avatar" src="" alt="Avatar">
                <div class="user-info">
                    <span id="displayUsername">User</span>
                    <button id="logoutBtn" class="logout-btn">Change Profile</button>
                </div>
            </div>
        </div>

        <div class="main-chat">
            <div class="chat-header">
                <div class="header-title" id="currentRoomName"># Select a room</div>
                <button id="videoCallBtn" class="call-btn"><i class="fa-solid fa-video"></i> Video / Voice</button>
            </div>
            
            <div class="chat-box" id="chatBox"></div>
            
            <form class="chat-input" id="messageForm">
                <input type="text" id="messageInput" placeholder="Type a message..." required autocomplete="off">
                <button type="submit"><i class="fa-solid fa-paper-plane"></i></button>
            </form>
        </div>
    </div>

    <script>
        // --- 1. Supabase Setup ---
        const SB_URL = "https://jziqxqpvgeiwbthdxbze.supabase.co";
        const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp6aXF4cXB2Z2Vpd2J0aGR4YnplIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3NjMwMTEsImV4cCI6MjEwMzMzOTAxMX0.opW1zH8ivEFbPTkn5r1EaINzvfH8fUflU8TPL9QVaw0";
        const supabase = window.supabase.createClient(SB_URL, SB_KEY);

        // --- 2. State Variables ---
        let currentUser = null;
        let currentAvatar = null;
        let activeRoomId = null;

        // --- 3. UI Customization Logic ---
        document.getElementById('colorPicker').addEventListener('input', (e) => {
            document.documentElement.style.setProperty('--accent', e.target.value);
            localStorage.setItem('chat_color', e.target.value);
        });

        document.getElementById('themeToggle').addEventListener('click', () => {
            document.body.classList.toggle('light-mode');
            const isLight = document.body.classList.contains('light-mode');
            document.querySelector('#themeToggle i').className = isLight ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
            localStorage.setItem('chat_theme', isLight ? 'light' : 'dark');
        });

        // Load saved preferences on startup
        if (localStorage.getItem('chat_color')) {
            document.documentElement.style.setProperty('--accent', localStorage.getItem('chat_color'));
            document.getElementById('colorPicker').value = localStorage.getItem('chat_color');
        }
        if (localStorage.getItem('chat_theme') === 'light') {
            document.body.classList.add('light-mode');
            document.querySelector('#themeToggle i').className = 'fa-solid fa-sun';
        }

        // --- 4. Login / Profile Logic ---
        function checkLogin() {
            const savedUser = localStorage.getItem('chat_username');
            const savedAvatar = localStorage.getItem('chat_avatar');
            
            if (savedUser) {
                currentUser = savedUser;
                // Use custom URL if provided, otherwise generate a default one
                currentAvatar = savedAvatar || `https://ui-avatars.com/api/?name=${currentUser}&background=random`;
                
                document.getElementById('displayUsername').textContent = currentUser;
                document.getElementById('myAvatar').src = currentAvatar;
                
                document.getElementById('authModal').style.display = 'none';
                document.getElementById('mainApp').style.display = 'flex';
                fetchRooms();
            } else {
                document.getElementById('authModal').style.display = 'flex';
                document.getElementById('mainApp').style.display = 'none';
            }
        }

        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const name = document.getElementById('usernameInput').value.trim();
            const customAvatarUrl = document.getElementById('avatarInput').value.trim();
            
            if (name) {
                localStorage.setItem('chat_username', name);
                if (customAvatarUrl) {
                    localStorage.setItem('chat_avatar', customAvatarUrl);
                } else {
                    localStorage.removeItem('chat_avatar'); 
                }
                checkLogin();
            }
        });

        document.getElementById('logoutBtn').addEventListener('click', () => {
            localStorage.removeItem('chat_username');
            localStorage.removeItem('chat_avatar');
            document.getElementById('chatBox').innerHTML = '';
            activeRoomId = null;
            checkLogin();
        });

        // --- 5. Chat Rooms Logic ---
        async function fetchRooms() {
            const { data: rooms } = await supabase.from('rooms').select('*').order('name');
            const list = document.getElementById('channelsList');
            list.innerHTML = '';
            
            if (rooms) {
                rooms.forEach((room, index) => {
                    const el = document.createElement('div');
                    el.className = 'channel-item';
                    el.innerHTML = `<i class="fa-solid fa-hashtag"></i> ${room.name}`;
                    
                    el.onclick = () => {
                        document.querySelectorAll('.channel-item').forEach(c => c.classList.remove('active'));
                        el.classList.add('active');
                        switchRoom(room.id, room.name);
                    };
                    
                    list.appendChild(el);
                    
                    // Auto-select first room
                    if (index === 0 && !activeRoomId) el.click();
                });
            }
        }

        document.getElementById('createRoomBtn').addEventListener('click', async () => {
            const name = prompt("New room name:");
            if (name) {
                await supabase.from('rooms').insert([{ name }]);
                fetchRooms();
            }
        });

        async function switchRoom(id, name) {
            activeRoomId = id;
            document.getElementById('currentRoomName').textContent = `# ${name}`;
            const box = document.getElementById('chatBox');
            box.innerHTML = '';
            
            const { data } = await supabase.from('messages').select('*').eq('room_id', id).order('created_at');
            if (data) data.forEach(msg => appendMessage(msg));
        }

        // --- 6. Messaging Logic ---
        function appendMessage(msg) {
            const isSelf = msg.username === currentUser;
            
            // Format timestamp nicely
            const timeStr = new Date(msg.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            
            // Fallback to generated avatar if they didn't supply a custom one in the database
            const avatarToUse = msg.avatar_url || `https://ui-avatars.com/api/?name=${msg.username}&background=random`;
            
            const div = document.createElement('div');
            div.className = `msg-row ${isSelf ? 'self' : ''}`;
            
            div.innerHTML = `
                <img class="avatar" src="${avatarToUse}" style="width: 36px; height: 36px;">
                <div class="message">
                    <div class="msg-header">
                        <span class="msg-user">${msg.username}</span>
                        <span class="msg-time">${timeStr}</span>
                    </div>
                    <div>${msg.content}</div>
                </div>
            `;
            
            const box = document.getElementById('chatBox');
            box.appendChild(div);
            box.scrollTop = box.scrollHeight; // Auto-scroll to bottom
        }

        document.getElementById('messageForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const input = document.getElementById('messageInput');
            const content = input.value.trim();
            
            if (content && activeRoomId) {
                await supabase.from('messages').insert([{
                    username: currentUser, 
                    content: content, 
                    room_id: activeRoomId,
                    avatar_url: currentAvatar // Sends custom picture URL to database
                }]);
                input.value = '';
            }
        });

        // --- 7. Realtime Subscription ---
        supabase.channel('public:messages')
            .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
                if (payload.new.room_id === activeRoomId) appendMessage(payload.new);
            }).subscribe();

        // --- 8. Video / Voice Call Logic (Jitsi Integration) ---
        document.getElementById('videoCallBtn').addEventListener('click', () => {
            if (!activeRoomId) {
                alert("Select a chat room first.");
                return;
            }
            // Create a clean string out of the room name for the Jitsi URL
            const roomString = document.getElementById('currentRoomName').textContent.replace('# ', '').replace(/[^a-zA-Z0-9]/g, '_');
            const uniqueMeetingId = `FastChat_${roomString}_${activeRoomId}`;
            
            // Open video call in a new tab
            window.open(`https://meet.jit.si/${uniqueMeetingId}`, '_blank');
        });

        // --- Boot App ---
        checkLogin();
    </script>
</body>
</html>
