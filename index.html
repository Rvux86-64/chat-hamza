<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supabase Chat Dashboard</title>
    <!-- FontAwesome Premium Modern Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Include Supabase JS CDN Client Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        :root {
          --bg-main: #0b0f19;
          --panel-bg: #111827;
          --accent: #10b981;
          --accent-hover: #059669;
          --border-color: #1f2937;
          --text-main: #f3f4f6;
          --text-muted: #9ca3af;
          --msg-self: #047857;
          --msg-other: #1f2937;
        } 

        * { 
          box-sizing: border-box; 
          margin: 0; 
          padding: 0; 
          font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
        }

        body { 
          display: flex; 
          justify-content: center; 
          align-items: center; 
          height: 100vh; 
          background-color: var(--bg-main); 
          background-image: radial-gradient(circle at 10% 20%, rgba(16, 185, 129, 0.05) 0%, transparent 40%), radial-gradient(circle at 90% 80%, rgba(59, 130, 246, 0.05) 0%, transparent 40%); 
          color: var(--text-main); 
          overflow: hidden; 
        }

        .chat-wrapper { 
          display: flex; 
          width: 950px; 
          height: 700px; 
          background: rgba(17, 24, 39, 0.8); 
          backdrop-filter: blur(12px); 
          border: 1px solid var(--border-color); 
          border-radius: 16px; 
          box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5); 
          overflow: hidden; 
        }

        .sidebar { 
          width: 280px; 
          background: #0d1321; 
          border-right: 1px solid var(--border-color); 
          padding: 24px; 
          display: flex; 
          flex-direction: column; 
          gap: 24px; 
        }

        .brand { 
          display: flex; 
          align-items: center; 
          gap: 12px; 
          font-size: 1.3rem; 
          font-weight: 700; 
          color: var(--accent); 
        }

        /* New Interactive Channels UI Classes */
        .channels-section {
          display: flex;
          flex-direction: column;
          gap: 10px;
          flex: 1;
          overflow-y: auto;
        }

        .section-title {
          font-size: 0.75rem; 
          color: var(--text-muted); 
          text-transform: uppercase; 
          letter-spacing: 0.5px;
          font-weight: 600;
        }

        .channels-list {
          display: flex;
          flex-direction: column;
          gap: 6px;
        }

        .channel-item {
          display: flex;
          align-items: center;
          padding: 10px 14px;
          border-radius: 8px;
          cursor: pointer;
          color: var(--text-muted);
          font-size: 0.95rem;
          transition: all 0.2s ease;
        }

        .channel-item:hover {
          background: rgba(255, 255, 255, 0.03);
          color: var(--text-main);
        }

        .channel-item.active {
          background: rgba(16, 185, 129, 0.1);
          color: var(--accent);
          font-weight: 600;
        }

        .user-card { 
          display: flex; 
          flex-direction: column; 
          gap: 8px; 
          background: rgba(255,255,255,0.02); 
          padding: 14px; 
          border-radius: 8px; 
          border: 1px solid var(--border-color); 
        }

        .user-card label { 
          font-size: 0.75rem; 
          color: var(--text-muted); 
          text-transform: uppercase; 
          letter-spacing: 0.5px; 
        }

        .user-card input { 
          background: #1f2937; 
          border: 1px solid #374151; 
          color: var(--text-main); 
          padding: 8px 12px; 
          border-radius: 6px; 
          outline: none; 
          font-size: 0.95rem; 
          transition: all 0.2s; 
        }

        .user-card input:focus { 
          border-color: var(--accent); 
          box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.2); 
        }

        .status-indicator { 
          margin-top: auto; 
          display: flex; 
          align-items: center; 
          gap: 8px; 
          font-size: 0.8rem; 
          color: var(--text-muted); 
        }

        .pulse-dot { 
          width: 8px; 
          height: 8px; 
          background: var(--accent); 
          border-radius: 50%; 
          box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); 
          animation: pulse 1.6s infinite; 
        }

        .main-chat { 
          flex: 1; 
          display: flex; 
          flex-direction: column; 
          background: rgba(17, 24, 39, 0.4); 
        }

        .chat-header { 
          padding: 20px 24px; 
          border-bottom: 1px solid var(--border-color); 
          background: rgba(17, 24, 39, 0.6); 
        }

        .header-info h3 { 
          font-size: 1.1rem; 
          font-weight: 600; 
        }

        .header-info p { 
          font-size: 0.8rem; 
          color: var(--text-muted); 
        }

        .chat-box { 
          flex: 1; 
          padding: 24px; 
          overflow-y: auto; 
          display: flex; 
          flex-direction: column; 
          gap: 16px; 
          scroll-behavior: smooth; 
        }

        .message { 
          padding: 12px 16px; 
          border-radius: 12px; 
          max-width: 70%; 
          width: fit-content; 
          background: var(--msg-other); 
          border: 1px solid rgba(255, 255, 255, 0.03); 
          color: var(--text-main); 
          word-break: break-word; 
          animation: slideUp 0.25s ease-out forwards; 
        }

        .message.self { 
          background: var(--msg-self); 
          align-self: flex-end; 
          border-bottom-right-radius: 2px; 
        }

        .message:not(.self) { 
          border-bottom-left-radius: 2px; 
        }

        .msg-user { 
          font-weight: 700; 
          font-size: 0.75rem; 
          color: var(--accent); 
          display: block; 
          margin-bottom: 4px; 
        }

        .message.self .msg-user { 
          color: #a7f3d0; 
        }

        .msg-text { 
          font-size: 0.95rem; 
          line-height: 1.4; 
        }

        .chat-input-container { 
          display: flex; 
          padding: 20px 24px; 
          background: #0d1321; 
          border-top: 1px solid var(--border-color); 
          gap: 12px; 
        }

        .chat-input-container input { 
          flex: 1; 
          background: #1f2937; 
          border: 1px solid #374151; 
          color: var(--text-main); 
          padding: 14px 18px; 
          border-radius: 8px; 
          outline: none; 
          font-size: 0.95rem; 
          transition: all 0.2s; 
        }

        .chat-input-container input:focus { 
          border-color: var(--accent); 
          box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.2);
        }

        .chat-input-container button { 
          background: var(--accent); 
          border: none; 
          color: white; 
          width: 48px; 
          height: 48px; 
          border-radius: 8px; 
          cursor: pointer; 
          display: flex; 
          justify-content: center; 
          align-items: center; 
          font-size: 1.1rem; 
          transition: background 0.2s, transform 0.1s; 
        }

        .chat-input-container button:hover { 
          background: var(--accent-hover); 
        }

        .chat-input-container button:active { 
          transform: scale(0.95); 
        }

        .chat-box::-webkit-scrollbar { width: 6px; }
        .chat-box::-webkit-scrollbar-track { background: transparent; }
        .chat-box::-webkit-scrollbar-thumb { background: #374151; border-radius: 10px; }

        @keyframes pulse { 
          0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); } 
          70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); } 
          100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); } 
        }

        @keyframes slideUp { 
          from { opacity: 0; transform: translateY(12px); } 
          to { opacity: 1; transform: translateY(0); } 
        }

        @media(max-width: 768px) { 
          .chat-wrapper { width: 100vw; height: 100vh; border-radius: 0; border: none; } 
          .sidebar { display: none; } 
        }
    </style>
</head>
<body>
    <div class="chat-wrapper">
        <!-- Sidebar Dashboard Info -->
        <div class="sidebar">
            <div class="brand">
                <i class="fa-solid fa-circle-nodes"></i>
                <span>SupaChat v2</span>
            </div>
            
            <!-- Dynamic Channels Navigation -->
            <div class="channels-section">
                <label class="section-title"><i class="fa-solid fa-comments"></i> Group Chats</label>
                <div class="channels-list" id="channelsList">
                    <!-- Dynamic channels injection stream -->
                </div>
            </div>

            <div class="user-card">
                <label for="username"><i class="fa-solid fa-user-shield"></i> Current Profile</label>
                <input type="text" id="username" placeholder="Username" value="Guest User">
            </div>
            <div class="status-indicator">
                <span class="pulse-dot"></span>
                <span class="status-text">Connected to Supabase Realtime</span>
            </div>
        </div>

        <!-- Main Chat Window Area -->
        <div class="main-chat">
            <div class="chat-header">
                <div class="header-info">
                    <h3 id="currentChannelName"># Loading...</h3>
                    <p>Real-time end-to-end database sync</p>
                </div>
            </div>
            <div class="chat-box" id="chatBox">
                <!-- Messages dynamic injection stream -->
            </div>
            <form class="chat-input-container" id="messageForm">
                <input type="text" id="messageInput" placeholder="Write something meaningful..." required autocomplete="off">
                <button type="submit" id="sendBtn">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </form>
        </div>
    </div>
    
    <script>
        // 1. Core Supabase App API Credentials Verification 
        const SB_URL = "https://jziqxqpvgeiwbthdxbze.supabase.co";
        const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp6aXF4cXB2Z2Vpd2J0aGR4YnplIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3NjMwMTEsImV4cCI6MjEwMzMzOTAxMX0.opW1zH8ivEFbPTkn5r1EaINzvfH8fUflU8TPL9QVaw0";

        const supabase2 = window.supabase.createClient(SB_URL, SB_KEY);

        // 2. DOM Node Element Maps
        const chatBox = document.getElementById('chatBox');
        const messageForm = document.getElementById('messageForm');
        const messageInput = document.getElementById('messageInput');
        const usernameInput = document.getElementById('username');
        const channelsList = document.getElementById('channelsList');
        const currentChannelName = document.getElementById('currentChannelName');

        // 3. Dynamic Application State Variables
        let activeRoomId = null;

        // 4. Fetch and Render Group Chat Rooms Sidebar list
        async function fetchRooms() {
            const { data: rooms, error } = await supabase2
                .from('rooms')
                .select('*')
                .order('name', { ascending: true });

            if (error) {
                console.error('Error loading chat groups:', error);
                return;
            }

            channelsList.innerHTML = ''; // Clear skeleton UI loading logs
            
            if (rooms && rooms.length > 0) {
                rooms.forEach((room, index) => {
                    const roomEl = document.createElement('div');
                    roomEl.classList.add('channel-item');
                    roomEl.setAttribute('data-id', room.id);
                    roomEl.innerHTML = `<i class="fa-solid fa-hashtag"></i> ${room.name}`;
                    
                    roomEl.addEventListener('click', () => switchRoom(room.id, room.name));
                    channelsList.appendChild(roomEl);

                    // Default route context initial fallback selection 
                    if (index === 0) {
                        switchRoom(room.id, room.name);
                    }
                });
            }
        }

        // 5. Context Switch Router function for changing chat rooms
        async function switchRoom(roomId, roomName) {
            if (activeRoomId === roomId) return;
            activeRoomId = roomId;
            
            // Update Channel Name Display
            currentChannelName.textContent = `# ${roomName}`;
            
            // Toggle active classes on visual elements
            document.querySelectorAll('.channel-item').forEach(el => {
                if (el.getAttribute('data-id') === roomId) el.classList.add('active');
                else el.classList.remove('active');
            });

            // Clear output window canvas and request new contextual scope
            chatBox.innerHTML = '';
            await fetchMessages();
        }

        // 6. Fetch Existing Isolated Chat Stream History by Room ID
        async function fetchMessages() {
            const { data, error } = await supabase2
                .from('messages')
                .select('*')
                .eq('room_id', activeRoomId)
                .order('created_at', { ascending: true });

            if (error) console.error('Error loading history:', error);
            else data.forEach(msg => appendMessage(msg));
        }

        // 7. Inject Raw Message elements into Output Viewport
        function appendMessage(msg) {
            const currentUsername = usernameInput.value.trim() || 'Anonymous';
            const isSelf = msg.username === currentUsername;
            const msgElement = document.createElement('div');
            msgElement.classList.add('message');
            if (isSelf) msgElement.classList.add('self');

            msgElement.innerHTML = `
                <span class="msg-user">${isSelf ? 'You' : msg.username}</span>
                <span class="msg-text">${msg.content}</span>
            `;
            chatBox.appendChild(msgElement);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // 8. Intercept Outbound Forms Submission & Bind Active Room ID Scope
        messageForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const content = messageInput.value.trim();
            const username = usernameInput.value.trim() || 'Anonymous';

            if (!content || !activeRoomId) return;

            // Send payload safely contextualized to the group room being viewed
            const { error } = await supabase2
                .from('messages')
                .insert([{ username, content, room_id: activeRoomId }]);

            if (error) console.error('Error sending message payload:', error);
            else messageInput.value = '';
        });

        // 9. Realtime Channel Multi-Tenant Listener Event Handling Filter
        supabase2
            .channel('public:messages')
            .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
                // Only append live database updates if the message belongs to the current room
                if (payload.new.room_id === activeRoomId) {
                    appendMessage(payload.new);
                }
            })
            .subscribe();

        // Fire application launch cycle sequence
        fetchRooms();
    </script>
</body>
</html>
